[package]
name = "finances-core"
description = "Secure, offline-first household finances core: SQLite storage, validation, money math, backup/restore and CSV/XML export guardrails"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
rusqlite = { version = "0.42", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
getrandom = "0.3"

[dev-dependencies]
tempfile = "3"
